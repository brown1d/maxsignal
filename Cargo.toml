[package]
name = "maxsignal"
version = "0.2.0"
edition = "2024"
description = "A Bevy-based synthetic 1980s broadcast presenter engine"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
